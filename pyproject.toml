[project]
name = "evaluator-gym"
version = "0.1.0"
description = "Verifiable evaluation environment for AI agents (Niural take-home gym)."
requires-python = ">=3.10"
dependencies = [
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@66a60649^1",
    "datasets",
    "pydantic>=2",
    "jsonschema>=4",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator_gym"]

[tool.hatch.build.targets.wheel.sources]
"src/evaluator_gym" = "evaluator_gym"

[tool.hatch.build.targets.wheel.force-include]
"src/evaluator_gym/rubric/judge_prompt.txt" = "evaluator_gym/rubric/judge_prompt.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
markers = [
    "fidelity: independent reference fidelity tests (not circular GT checks)",
    "consistency: generator/reference consistency only",
    "live: requires GROQ_API_KEY (or OPENAI_API_KEY) and network; opt-in only",
]

[tool.ruff]
line-length = 100
target-version = "py310"
